<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick-theme.css" />
</head>

<body>
    <!-- Main Slider -->
    <div class="slider-main">
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 1"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 2"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 3"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 4"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 5"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 6"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Slide 7"></div>
    </div>

    <!-- Thumbnail Slider -->
    <div class="slider-thumb">
        <div><img src="./assets/images/LymphaticDrainage. png" alt="Thumb 1"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 2"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 3"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 4"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 5"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 6"></div>
        <div><img src="./assets/images/LymphaticDrainage.png" alt="Thumb 7"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.min.js"></script>
    <script>
        $(document).ready(function () {
            // ✅ Khởi tạo MAIN slider
            $(".slider-main").slick({
                slidesToShow: 1,
                slidesToScroll: 1,
                arrows: true,
                asNavFor: ".slider-thumb", // Link với thumbnail
                infinite: true,
                adaptiveHeight: true,
            });

            // ✅ Khởi tạo THUMBNAIL slider
            $(".slider-thumb").slick({
                slidesToShow: 4,        // Hiển thị 4 thumbnails
                slidesToScroll: 1,
                asNavFor: ".slider-main", // Link với main slider
                dots: false,
                centerMode: true,
                focusOnSelect: true,    // Click vào thumbnail để chuyển slide
                infinite: true,
                arrows: false,
            });
        });
    </script>
</body>

</html>
